<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img" aria-labelledby="t d" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI Variable Display&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif"><title id="t">Screens stay within one frame, except with one far viewer</title><desc id="d">The 99th-percentile gap between viewers' screens: within one 16.7 ms frame with no trouble, 5% loss and 25 ms delay; 33 and 43 ms with one viewer 60 ms farther away.</desc><path d="M250,56 H363.59521484375 Q367.59521484375,56 367.59521484375,60 V68 Q367.59521484375,72 363.59521484375,72 H250 Z" fill="#2a78d6"><title>no network trouble: 16.7–16.8 ms</title></path><text x="234" y="69" font-size="14" font-weight="400" fill="#52514e" text-anchor="end">no network trouble</text><text x="377.59521484375" y="69" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">16.7–16.8 ms</text><path d="M250,104 H363.600341796875 Q367.600341796875,104 367.600341796875,108 V116 Q367.600341796875,120 363.600341796875,120 H250 Z" fill="#2a78d6"><title>5% of data lost: 0.2–16.8 ms</title></path><text x="234" y="117" font-size="14" font-weight="400" fill="#52514e" text-anchor="end">5% of data lost</text><text x="377.600341796875" y="117" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">0.2–16.8 ms</text><path d="M250,152 H363.60205078125 Q367.60205078125,152 367.60205078125,156 V164 Q367.60205078125,168 363.60205078125,168 H250 Z" fill="#2a78d6"><title>every link 25 ms delayed: 16.6–16.8 ms</title></path><text x="234" y="165" font-size="14" font-weight="400" fill="#52514e" text-anchor="end">every link 25 ms delayed</text><text x="377.60205078125" y="165" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">16.6–16.8 ms</text><path d="M250,200 H546.0703671872034 Q550.0703671872034,200 550.0703671872034,204 V212 Q550.0703671872034,216 546.0703671872034,216 H250 Z" fill="#d03b3b"><title>one viewer 60 ms farther away: 33 and 43 ms · missed</title></path><text x="234" y="213" font-size="14" font-weight="400" fill="#52514e" text-anchor="end">one viewer 60 ms farther away</text><text x="560.0703671872034" y="213" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">33 and 43 ms · missed</text><line x1="250.5" y1="40" x2="250.5" y2="232" stroke="#e9e8e2" stroke-width="1"/><line x1="367.5" y1="38" x2="367.5" y2="232" stroke="#6e6c66" stroke-width="1" stroke-dasharray="3 4"/><text x="366.9" y="30" font-size="12" font-weight="400" fill="#6e6c66" text-anchor="middle">one frame, 16.7 ms</text></svg>
