log_format murmur_nopath '$time_iso8601 $remote_addr $request_method $status $body_bytes_sent $request_time';
limit_conn_zone $binary_remote_addr zone=murmur_ws:10m;
limit_conn_zone $binary_remote_addr zone=murmur_tracker:10m;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name murmurwatch.duckdns.org;
    access_log /var/log/nginx/murmur-access.log murmur_nopath;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://murmurwatch.duckdns.org$request_uri;
    }
}
