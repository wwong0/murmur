server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name murmurwatch.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/murmurwatch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murmurwatch.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/murmur-access.log murmur_nopath;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /ws {
        limit_conn murmur_ws 64;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /tracker {
        if ($http_upgrade !~* ^websocket$) {
            return 404;
        }
        limit_conn murmur_tracker 64;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
